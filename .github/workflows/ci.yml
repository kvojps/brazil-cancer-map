name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: uv sync --locked
      - run: npm ci --prefix pipeline
      - run: uv run mypy
      - run: uv run pytest

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Locate the installed Chromium
        run: node --input-type=module -e 'import { chromium } from "playwright-core"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, `CHROMIUM_PATH=${chromium.executablePath()}\n`);'
      - run: npm run preview -- --background --host 127.0.0.1 --port 4321
      - run: npm run test:a11y
        env:
          SITE_URL: http://127.0.0.1:4321
          A11Y_REPORT_DIR: accessibility-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: site/accessibility-results/
      - run: npm run preview -- stop
        if: always()
