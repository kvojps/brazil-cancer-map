name: HPV annual partitions

on:
  workflow_dispatch:
    inputs:
      year:
        description: Year to process (blank means all years since 2020)
        type: string
        required: false
  schedule:
    - cron: '0 6 20 * *'

permissions:
  contents: write

concurrency:
  group: hpv-state
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.years.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: years
        env:
          SELECTED_YEAR: ${{ inputs.year }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          current = datetime.datetime.now(datetime.timezone.utc).year
          selected = os.environ['SELECTED_YEAR']
          years = [int(selected)] if selected else list(range(2020, current + 1))
          if any(year < 2020 or year > current for year in years):
              raise ValueError('Invalid HPV partition year')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=' + json.dumps(years) + '\n')
          PY
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view hpv-state >/dev/null 2>&1; then
            gh release create hpv-state --title 'HPV incremental state' --notes 'Monthly reduced SI-PNI state; no raw ZIP collection.' --prerelease
          fi

  year:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        year: ${{ fromJSON(needs.prepare.outputs.years) }}
    steps:
      - name: Measure the whole job from before checkout
        run: |
          date +%s > /tmp/hpv-job-start
          df -B1 --output=avail / | tail -1 > /tmp/hpv-job-initial-free
          nohup bash -c 'while true; do date +%s; df -B1 --output=avail / | tail -1; sleep 2; done' > /tmp/hpv-job-disk.log 2>&1 &
          echo $! > /tmp/hpv-job-monitor.pid
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Install Chromium for official cohorts
        run: uv run playwright install --with-deps chromium
      - name: Restore durable reduced state
        env:
          GH_TOKEN: ${{ github.token }}
          PARTITION_YEAR: ${{ matrix.year }}
        run: |
          if gh release view hpv-state --json assets --jq '.assets[].name' | rg -qx "hpv-${PARTITION_YEAR}.tar.gz"; then
            gh release download hpv-state --pattern "hpv-${PARTITION_YEAR}.tar.gz" --dir /tmp
            tar -xzf "/tmp/hpv-${PARTITION_YEAR}.tar.gz"
          fi
      - name: Download and reduce one month at a time
        run: uv run python -m pipeline run --source hpv --step download --year ${{ matrix.year }}
      - name: Persist only reduced state and measurements
        env:
          GH_TOKEN: ${{ github.token }}
          PARTITION_YEAR: ${{ matrix.year }}
        run: |
          tar -czf "/tmp/hpv-${PARTITION_YEAR}.tar.gz" data/clean/hpv
          test "$(stat -c%s "/tmp/hpv-${PARTITION_YEAR}.tar.gz")" -lt 2147483648
          gh release upload hpv-state "/tmp/hpv-${PARTITION_YEAR}.tar.gz" --clobber
      - name: Retain failed-run measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hpv-measurements-${{ matrix.year }}
          path: data/clean/hpv/months/**/*.json
          if-no-files-found: ignore
      - name: Record total duration and disk headroom
        if: always()
        run: |
          kill "$(cat /tmp/hpv-job-monitor.pid)" || true
          python3 - <<'PYMETRICS'
          import json, pathlib, time
          values = pathlib.Path('/tmp/hpv-job-disk.log').read_text().splitlines()
          free = [int(value) for value in values[1::2]]
          initial = int(pathlib.Path('/tmp/hpv-job-initial-free').read_text())
          metrics = {
              'duration_seconds': int(time.time()) - int(pathlib.Path('/tmp/hpv-job-start').read_text()),
              'initial_available_bytes': initial,
              'minimum_available_bytes': min(free),
              'peak_disk_growth_bytes': initial - min(free),
              'sampling_interval_seconds': 2,
              'scope': 'checkout, dependencies, Chromium, restore, download, reduction and state compression; final metrics upload excluded',
          }
          pathlib.Path('/tmp/hpv-job-metrics.json').write_text(json.dumps(metrics, indent=2))
          print(json.dumps(metrics, indent=2))
          PYMETRICS
      - name: Retain whole-job measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hpv-job-metrics-${{ matrix.year }}
          path: |
            /tmp/hpv-job-metrics.json
            /tmp/hpv-job-disk.log
