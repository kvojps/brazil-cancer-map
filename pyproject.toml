[project]
name = "pipeline"
version = "0.1.0"
description = "Pipeline de dados do Observatório do Câncer no Brasil"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]

[tool.mypy]
files = ["pipeline"]
strict = true

[[tool.mypy.overrides]]
module = "pipeline.tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
