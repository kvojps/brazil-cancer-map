[project]
name = "pipeline"
version = "0.1.0"
description = "Data pipeline for the Observatório do Câncer no Brasil"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "datasus-dbc>=0.1.3",
    "dbfread>=2.0.7",
    "duckdb>=2.0.0",
    "playwright>=1.64.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]

[tool.mypy]
files = ["pipeline"]
strict = true

[[tool.mypy.overrides]]
module = "pipeline.tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["statsmodels.*", "scipy.*", "dbfread.*", "datasus_dbc.*"]
ignore_missing_imports = true
